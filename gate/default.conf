server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://homarr:7575;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        proxy_buffering on;
        sub_filter_once on;
        sub_filter_types text/html;
        sub_filter '</body>' '<style>.byd-exit{position:fixed;top:12px;right:14px;z-index:99999;background:rgba(20,20,23,.85);border:1px solid #2a2a2f;border-radius:8px;color:#9b968a;font:700 18px/1 system-ui,sans-serif;width:36px;height:36px;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}.byd-exit:hover{color:#ff7a1a;border-color:#ff7a1a}</style><a class="byd-exit" href="/?exit=1" title="Back to logo">&times;</a></body>';
    }
}
